name: PS5 Cloud Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cloud-server:
    name: Cloud Server Diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Information
        shell: bash
        run: |
          echo "================================"
          echo "       SYSTEM INFORMATION"
          echo "================================"

          echo "=== OS ==="
          uname -a
          cat /etc/os-release

          echo "=== CPU ==="
          lscpu

          echo "=== RAM ==="
          free -h

          echo "=== STORAGE ==="
          df -h

      - name: GPU Deep Diagnostic
        shell: bash
        run: |
          echo "================================"
          echo "       GPU DEEP DIAGNOSTIC"
          echo "================================"

          echo "=== GPU DEVICES ==="
          ls -lah /dev/dri/ 2>&1 || true

          echo "=== GPU VENDOR ==="
          shopt -s nullglob
          for f in /sys/class/drm/card*/device/vendor; do
            echo "File: $f"
            cat "$f" 2>/dev/null || true
          done

          echo "=== GPU DEVICE ID ==="
          for f in /sys/class/drm/card*/device/device; do
            echo "File: $f"
            cat "$f" 2>/dev/null || true
          done

          echo "=== GPU DRIVER ==="
          for f in /sys/class/drm/card*/device/uevent; do
            echo "File: $f"
            cat "$f" 2>/dev/null || true
          done

          echo "=== DRM DRIVER NAME ==="
          for f in /sys/class/drm/card*/device/driver; do
            echo "$f -> $(readlink -f "$f")"
          done

          echo "=== NVIDIA ==="
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          else
            echo "NVIDIA-SMI NOT AVAILABLE"
          fi

          echo "=== GPU DIAGNOSTIC FINISHED ==="

      - name: Display Diagnostic
        shell: bash
        run: |
          echo "================================"
          echo "       DISPLAY DIAGNOSTIC"
          echo "================================"

          echo "=== DISPLAY VARIABLE ==="
          echo "${DISPLAY:-NOT SET}"

          echo "=== XVFB CHECK ==="
          if command -v Xvfb >/dev/null 2>&1; then
            echo "XVFB INSTALLED"
            command -v Xvfb
          else
            echo "XVFB NOT INSTALLED"
          fi

          echo "=== X11 SOCKET ==="
          ls -lah /tmp/.X11-unix/ 2>&1 || true

          echo "=== GLX INFO ==="
          if command -v glxinfo >/dev/null 2>&1; then
            glxinfo -B 2>&1 || true
          else
            echo "GLXINFO NOT INSTALLED"
          fi

          echo "=== DISPLAY DIAGNOSTIC COMPLETED ==="

      - name: Network Diagnostic
        shell: bash
        run: |
          echo "================================"
          echo "       NETWORK DIAGNOSTIC"
          echo "================================"

          echo "=== IP ADDRESS ==="
          if command -v ip >/dev/null 2>&1; then
            ip -brief address
          else
            echo "IP COMMAND NOT AVAILABLE"
          fi

          echo "=== PORTS ==="
          if command -v ss >/dev/null 2>&1; then
            ss -tuln
          else
            echo "SS COMMAND NOT AVAILABLE"
          fi

          echo "=== INTERNET ==="
          if curl -Is --max-time 10 https://github.com >/dev/null 2>&1; then
            echo "INTERNET CONNECTION OK"
          else
            echo "INTERNET CONNECTION CHECK FAILED"
          fi

      - name: Environment Summary
        shell: bash
        run: |
          echo "================================"
          echo "       FINAL SUMMARY"
          echo "================================"

          echo "Hostname: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "CPU Cores: $(nproc)"
          echo "RAM:"
          free -h

          echo "=== AVAILABLE COMMANDS ==="
          for cmd in git bash curl Xvfb nvidia-smi; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "$cmd: AVAILABLE"
            else
              echo "$cmd: NOT AVAILABLE"
            fi
          done

          echo "================================"
          echo "   PS5 CLOUD LAB DIAGNOSTIC"
          echo "       COMPLETED"
          echo "================================"
