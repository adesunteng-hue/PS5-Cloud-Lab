name: PS5 Cloud Lab

on:
  workflow_dispatch:

jobs:
  cloud-server:
    name: Ubuntu Cloud Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: CPU Diagnostic
        run: |
          echo "=== CPU ==="
          lscpu

      - name: RAM Diagnostic
        run: |
          echo "=== RAM ==="
          free -h

      - name: GPU Diagnostic
        run: |
          echo "=== GPU DEVICES ==="
          ls -la /dev/dri/ || true
          echo "=== NVIDIA ==="
          nvidia-smi || true
      
      - name: GPU Deep Diagnostic
        run: |
          echo "=== GPU DRIVER ==="
          ls -l /sys/class/drm/
          echo "=== GPU INFORMATION ==="
          for f in /sys/class/drm/card*/device/vendor /sys/class/drm/card*/device/device; do
            echo "$f"
            cat "$f" 2>/dev/null || true
          done
          echo "=== VIDEO ENCODERS ==="
          ls /dev/dri/
 
      - name: Display Diagnostic
        run: |
          echo "=== DISPLAY ==="
          echo "DISPLAY=$DISPLAY"
          command -v Xvfb || true

      - name: Network Diagnostic
        run: |
          echo "=== NETWORK ==="
          ip -brief address
          ss -tuln

      - name: Diagnostic Complete
        run: |
          echo "PS5 Cloud Lab is ready!"
