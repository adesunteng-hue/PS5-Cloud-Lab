name: PS5 Cloud Lab

on:
  workflow_dispatch:

jobs:
  cloud-server:
    name: Ubuntu Cloud Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: CPU Diagnostic
        run: |
          echo "=== CPU ==="
          lscpu

      - name: RAM Diagnostic
        run: |
          echo "=== RAM ==="
          free -h

      - name: GPU Diagnostic
        run: |
          echo "=== GPU DEVICES ==="
          ls -la /dev/dri/ || true
          echo "=== NVIDIA ==="
          nvidia-smi || true

      - name: Display Diagnostic
        run: |
          echo "=== DISPLAY ==="
          echo "DISPLAY=$DISPLAY"
          command -v Xvfb || true

      - name: Network Diagnostic
        run: |
          echo "=== NETWORK ==="
          ip -brief address
          ss -tuln

      - name: Diagnostic Complete
        run: |
          echo "PS5 Cloud Lab is ready!"
