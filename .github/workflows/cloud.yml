name: PS5 Cloud Lab Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloud-server:
    name: PS5 Cloud Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install Desktop Environment
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            xvfb \
            x11vnc \
            xauth \
            mesa-utils \
            mesa-vulkan-drivers \
            libgl1 \
            pulseaudio \
            curl \
            wget \
            unzip \
            jq

      - name: Install Sunshine
        run: |
          curl -1sLf \
            'https://dl.cloudsmith.io/public/lizardbyte/stable/cfg/setup/bash.deb.sh' \
            | sudo -E bash

          sudo apt-get update
          sudo apt-get install -y sunshine

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Start Virtual Display
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 3

      - name: Start XFCE Desktop
        run: |
          export DISPLAY=:99

          mkdir -p /tmp/runtime-runner
          chmod 700 /tmp/runtime-runner

          export XDG_RUNTIME_DIR=/tmp/runtime-runner

          pulseaudio --start || true

          dbus-run-session -- xfce4-session \
            > /tmp/xfce.log 2>&1 &

          sleep 10

      - name: Start Sunshine Server
        run: |
          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/runtime-runner

          mkdir -p "$HOME/.config/sunshine"

          nohup sunshine \
            > /tmp/sunshine.log 2>&1 &

          sleep 5

      - name: Run Cloud Session
        run: |
          echo "================================"
          echo "       PS5 CLOUD LAB"
          echo "================================"
          echo "OS: Ubuntu 24.04"
          echo "Desktop: XFCE"
          echo "Display: 1280x720"
          echo "Streaming: Sunshine"
          echo "Session: 120 Minutes"
          echo "================================"

          sleep 6900
